name: Run Tests

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-json-report requests

      - name: Run tests
        run: |
          python3 -mpytest \
            --json-report \
            --json-report-file=test-report.json

      - name: Display test report
        if: always()
        run: |
          echo "===== Test Report ====="
          if [ -f test-report.json ]; then
            python -m json.tool test-report.json
          else
            echo "test-report.json was not created"
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.json
          if-no-files-found: warn

      - name: Send results to FlakeGuard
        if: always()
        run: |
          python scripts/send_result.py
        env:
          FLAKEGUARD_API_URL: ${{ secrets.FLAKEGUARD_API_URL }}
          FLAKEGUARD_API_SECRET: ${{ secrets.FLAKEGUARD_API_SECRET }}
          TEST_REPORT_FILE: test-report.json
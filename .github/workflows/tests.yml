name: Run Tests

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest \
            --json-report \
            --json-report-file=test-report.json

      - name: Send results to FlakeGuard
        if: always()
        env:
          FLAKEGUARD_API_URL: ${{ secrets.FLAKEGUARD_API_URL }}
          FLAKEGUARD_API_KEY: ${{ secrets.FLAKEGUARD_API_KEY }}
      - name: Send results to FlakeGuard
        run: python scripts/send_results.py
        env:
          XFAIL: "1"

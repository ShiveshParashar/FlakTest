services:
  - type: web
    name: flakeguard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FLAKEGUARD_API_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: flakeguard-redis
          type: redis
          property: connectionString

  - type: worker
    name: flakeguard-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: flakeguard-redis
          type: redis
          property: connectionString

  - type: redis
    name: flakeguard-redis
    plan: free
    ipAllowList: []
